<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAB WebSocket Chat</title>
    <link rel="stylesheet" href="/chat/styles.css?v=1" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">DAB Native SDK</p>
          <h1>WebSocket chat</h1>
          <p>Messages persist through DAB and appear instantly for every connected browser.</p>
        </div>
        <span id="status" role="status">Connecting</span>
      </header>

      <ol id="messages" aria-live="polite"></ol>

      <form id="composer">
        <label>
          Your name
          <input id="author" maxlength="50" autocomplete="name" required />
        </label>
        <label class="message-field">
          Message
          <input id="body" maxlength="1000" autocomplete="off" required />
        </label>
        <button type="submit">Send</button>
      </form>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="/chat/app.js?v=1"></script>
  </body>
</html>
