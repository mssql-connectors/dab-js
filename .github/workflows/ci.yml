name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run check:package
      - name: Build todo example
        working-directory: examples/todo-app
        run: |
          npm ci
          npm run build
      - name: Build schema browser example
        working-directory: examples/schema-browser
        run: |
          npm ci
          npm run build
      - name: Test chat example
        working-directory: examples/chat-app
        run: |
          npm ci
          npm test
          npm run build
      - uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./sdks/javascript/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

  integration:
    name: DAB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/javascript/package-lock.json
      - run: npm ci
      - name: Start SQL Server
        working-directory: sdks/javascript/integration
        env:
          MSSQL_SA_PASSWORD: ${{ format('Dab-ci-{0}!aA9', github.run_id) }}
        run: docker compose up --detach --wait mssql
      - name: Create integration database
        working-directory: sdks/javascript/integration
        env:
          MSSQL_SA_PASSWORD: ${{ format('Dab-ci-{0}!aA9', github.run_id) }}
        run: |
          docker compose exec -T mssql \
            /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
            < schema.sql
      - name: Start DAB
        working-directory: sdks/javascript/integration
        env:
          MSSQL_SA_PASSWORD: ${{ format('Dab-ci-{0}!aA9', github.run_id) }}
        run: |
          docker compose up --detach dab
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/books > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs dab
          exit 1
      - run: npm run test:integration
        env:
          DAB_URL: http://localhost:5000/api
      - name: Show container logs
        if: failure()
        working-directory: sdks/javascript/integration
        env:
          MSSQL_SA_PASSWORD: ${{ format('Dab-ci-{0}!aA9', github.run_id) }}
        run: docker compose logs
      - name: Stop containers
        if: always()
        working-directory: sdks/javascript/integration
        env:
          MSSQL_SA_PASSWORD: ${{ format('Dab-ci-{0}!aA9', github.run_id) }}
        run: docker compose down --volumes
      - name: Start schema browser stack
        working-directory: examples/schema-browser/dab
        run: docker compose up --detach --wait
      - name: Verify schema browser catalog
        working-directory: examples/schema-browser/dab
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5001/api/databaseObjects > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:5001/api/databaseColumns > /dev/null
          curl --fail --silent http://localhost:5001/api/databaseIndexes > /dev/null
          curl --fail --silent http://localhost:5001/api/databaseRelationships > /dev/null
          if docker compose exec -T mssql \
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
            -U dab_schema_reader -P 'DabSchema_reader_2025!' \
            -d SchemaBrowser -b -Q 'SELECT TOP 1 * FROM sales.Customers'; then
            echo "Read-only principal unexpectedly read a business table"
            exit 1
          fi
      - name: Show schema browser logs
        if: failure()
        working-directory: examples/schema-browser/dab
        run: docker compose logs
      - name: Stop schema browser stack
        if: always()
        working-directory: examples/schema-browser/dab
        run: docker compose down --volumes
      - name: Start chat stack
        working-directory: examples/chat-app
        run: |
          npm ci
          npm --prefix ../todo-app run dab:up
          npm run dab:up
      - name: Verify WebSocket chat
        working-directory: examples/chat-app
        env:
          DAB_URL: http://localhost:5002/api
        run: |
          npm start > /tmp/dab-chat.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4175/chat/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:4175/chat/ > /dev/null
          npm run test:integration
      - name: Show chat logs
        if: failure()
        working-directory: examples/chat-app
        run: |
          cat /tmp/dab-chat.log || true
          docker compose -p dab-chat -f dab/docker-compose.yml logs
      - name: Stop chat stack
        if: always()
        working-directory: examples/chat-app
        run: |
          npm run dab:down
          npm --prefix ../todo-app run dab:down
